name: CI

on:
  pull_request:
  # Pushes to main run these checks through release.yml, which publishes only
  # once they pass.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fixtures are generated, not committed: the generator is deterministic,
      # so CI produces byte-identical input to a local run.
      - run: pnpm fixtures
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The registry is committed and shipped in the ui-shadcn tarball, so it
      # must match the sources it is generated from. registry.test.ts has just
      # regenerated it.
      - run: git diff --exit-code -- packages/ui-shadcn/registry
      - run: pnpm build
      # release.yml publishes exactly this build rather than making its own.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1
