name: CI

on:
  pull_request:
    paths:
      - "packages/**"
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest.config.ts
      - knip.json
  # Pushes to main run these checks through release.yml, which publishes only
  # once they pass.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fixtures are generated, not committed: the generator is deterministic,
      # so CI produces byte-identical input to a local run.
      - name: Generate fixtures
        run: pnpm fixtures
      - name: Check TypeScript syntax and types
        run: pnpm typecheck
      - name: Run lint
        run: pnpm lint
      - name: Check for unused files, dependencies and exports
        run: pnpm knip
      - name: Run tests
        run: pnpm test
      # The registry is committed and shipped in the ui-shadcn tarball, so it
      # must match the sources it is generated from. registry.test.ts has just
      # regenerated it.
      - name: Check if shadcn registry is up to date
        run: git diff --exit-code -- packages/ui-shadcn/registry
      - name: Build packages
        run: pnpm build
      # release.yml publishes exactly this build rather than making its own.
      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1
