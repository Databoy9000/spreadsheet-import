name: Release

# Every push to main publishes each package whose version in package.json is
# not on npm yet. Bumping a version is the release; anything else is a no-op.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Signs the npm provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # pnpm swaps `workspace:^` for real versions and skips versions that are
      # already published. Tarball contents come from each package's `files`.
      - run: pnpm -r --filter "./packages/*" publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
