name: Release

# Every push to main publishes each package whose version in package.json is
# not on npm yet. Bumping a version is the release; anything else is a no-op.
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest.config.ts

permissions:
  id-token: write # Required for OIDC (npm auth without 2FA)
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Signs the npm provenance attestation.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Only to link the workspace: pnpm resolves `workspace:^` through
      # node_modules. Nothing is built here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod --ignore-scripts
      # The build the check job tested.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      # pnpm swaps `workspace:^` for real versions and skips versions that are
      # already published. Tarball contents come from each package's `files`.
      - name: Publish packages
        run: pnpm -r --filter "./packages/*" publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_PROVENANCE: true
