name: Release

# Pushing a `v*` tag publishes each package whose version in package.json is
# not on npm yet. Bump the versions, merge to main, then tag that commit:
#
#   git tag v0.6.0 && git push origin v0.6.0
#
# The tag names the release, so at least one package must carry its version.
on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # Required for OIDC (npm auth without 2FA)
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history, to see whether the tagged commit is on main.
          fetch-depth: 0
      - name: Check the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Check a package carries the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -l "\"version\": \"$version\"" packages/*/package.json \
            || { echo "::error::No package is at version $version"; exit 1; }

  check:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Signs the npm provenance attestation.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Only to link the workspace: pnpm resolves `workspace:^` through
      # node_modules. Nothing is built here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod --ignore-scripts
      # The build the check job tested.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      # pnpm swaps `workspace:^` for real versions and skips versions that are
      # already published. Tarball contents come from each package's `files`.
      - name: Publish packages
        run: pnpm -r --filter "./packages/*" publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_PROVENANCE: true
